select_task:
  description: >
    Lee el texto de la memoria y extrae el contenido adecuado para cada ranura según su tipo.

    MEMORIA:
    Título: {title}
    Texto: {description}

    RANURAS: {exercise_types}

    REGLAS GENERALES:
    1. El array debe tener EXACTAMENTE tantos elementos como ranuras en la lista.
    2. Si hay varias ranuras del mismo tipo, cada una DEBE extraer contenido de una PARTE DISTINTA del texto.
       NUNCA repitas el mismo contenido ni algo muy parecido en dos ranuras del mismo tipo.

    REGLAS POR TIPO (aplica según el tipo de cada ranura):
    - fill_in_the_blank: Extrae UNA frase corta (1-2 oraciones) del texto que contenga un dato concreto.
    - multiple_choice: Extrae las frases o fragmentos del texto que contengan NOMBRES, FECHAS, LUGARES o DATOS CONCRETOS relevantes para hacer preguntas de opción múltiple. Devuelve esos fragmentos como texto corrido.
    - ordering: Extrae los EVENTOS Y ACCIONES del texto en orden cronológico, separados por " | ". Ejemplo: "Llegó el nieto | Merendamos churros | Jugamos videojuegos | Se fueron a las 21:00".

    RESPONDE SOLO con un array JSON. Sin markdown, sin texto extra.
    Ejemplo para 3 ranuras [fill_in_the_blank, multiple_choice, ordering]:
    ["Primero merendamos chocolate con churros.", "El nieto vino el 12 de junio. Jugaron videojuegos. La hija Lucía vino a las 21:00.", "Llegó el nieto | Merendamos churros | Jugamos videojuegos | Se fue a las 21:00"]

  expected_output: >
    Array JSON con exactamente tantos strings como ranuras en {exercise_types}.
    Cada string contiene el contenido apropiado para el tipo de ejercicio de esa ranura.
  agent: "selector_agent"

fill_in_the_blank_task:
  description: >
    Genera UN ejercicio fill_in_the_blank usando SOLO la INFORMACIÓN dada. No inventes nada.

    INFORMACIÓN:
    {informacion}

    DIFICULTAD: {dificultad}

    {feedback_ia}
    {content_to_avoid}

    REGLAS OBLIGATORIAS:
    1. La pregunta debe estar basada literalmente en la información.
    2. "question" debe contener exactamente un hueco: "_______".
    3. "correct_answer" debe ser una sola palabra que aparezca literalmente en la información.
    4. No ocultes adjetivos, conectores, verbos genéricos ni palabras deducibles por gramática.
    5. Escribe en primera o segunda persona si el texto lo permite. Nunca uses "el narrador" o "el protagonista".
    6. Si no hay una palabra válida para ocultar, usa el dato más concreto disponible, pero no inventes.

    ADAPTACIÓN DE DIFICULTAD:
    - fácil: oculta un dato central y evidente: persona principal, lugar principal u objeto importante. Pista directa.
    - media: oculta un dato secundario pero claro: objeto, acción concreta, lugar secundario o momento. Pista contextual.
    - difícil: oculta un detalle específico y poco obvio: cantidad, motivo, objeto mencionado una vez, sitio secundario o matiz. Pista indirecta.

    JSON REQUERIDO:
    {
      "type": "fill_in_the_blank",
      "question": string,
      "correct_answer": string,
      "hint": string,
      "difficulty": "{dificultad}"
    }
  expected_output: >
    Un único objeto JSON válido con las claves exactas:
    type, question, correct_answer, hint, difficulty.
  agent: "fill_in_the_blank_agent"


multiple_choice_task:
  description: >
    Genera UN ejercicio multiple_choice usando SOLO la INFORMACIÓN dada. No inventes hechos.

    INFORMACIÓN:
    {informacion}

    DIFICULTAD: {dificultad}

    {feedback_ia}
    {content_to_avoid}

    REGLAS OBLIGATORIAS:
    1. La pregunta debe tener una única respuesta correcta verificable en la información.
    2. "options" debe tener exactamente 3 strings.
    3. "correct_answer" debe ser el índice 0, 1 o 2 de la opción correcta.
    4. Los distractores deben ser falsos o no mencionados, pero de la misma categoría que la respuesta.
    5. No preguntes por datos ambiguos, opiniones, causas no explícitas o información ausente.
    6. Escribe en primera o segunda persona si el texto lo permite. Nunca uses "el narrador" o "el protagonista".

    ADAPTACIÓN DE DIFICULTAD:
    - fácil: pregunta por un dato central. Distractores muy distintos y claramente falsos.
    - media: pregunta por un dato secundario concreto. Distractores de la misma categoría.
    - difícil: pregunta por un detalle preciso, una relación explícita entre hechos o qué ocurrió antes/después. Distractores plausibles.

    JSON REQUERIDO:
    {
      "type": "multiple_choice",
      "question": string,
      "options": array de 3 strings,
      "correct_answer": integer,
      "hint": string,
      "difficulty": "{dificultad}"
    }
  expected_output: >
    Un único objeto JSON válido con las claves exactas:
    type, question, options, correct_answer, hint, difficulty.
  agent: "multiple_choice_agent"


ordering_task:
  description: >
    Genera UN ejercicio ordering usando SOLO la secuencia de la INFORMACIÓN dada.

    INFORMACIÓN:
    {informacion}

    DIFICULTAD: {dificultad}

    {feedback_ia}
    {content_to_avoid}

    REGLAS OBLIGATORIAS:
    1. Usa solo eventos o acciones que aparezcan en la información.
    2. No inventes pasos intermedios.
    3. "options" contiene los eventos desordenados.
    4. "correct_answer" contiene los mismos eventos en orden cronológico correcto.
    5. Cada elemento de "correct_answer" debe ser idéntico carácter por carácter a un elemento de "options".
    6. No uses frases vagas, descripciones de ambiente ni etiquetas como "Evento 1".
    7. EL NÚMERO DE OPCIONES ES ESTRICTO SEGÚN DIFICULTAD: fácil=3, media=4, difícil=5. Bajo ningún concepto generes más o menos elementos.
    8. Mantén las frases de los eventos lo más CORTAS y concisas posible (ej. "Llegué al hospital", no "Hoy martes he ido al hospital para hacer mi revisión").

    ADAPTACIÓN DE DIFICULTAD (ESTRICTO - respeta el número exacto de elementos):
    - fácil: EXACTAMENTE 3 eventos principales, claros y bien separados en el tiempo.
    - media: EXACTAMENTE 4 eventos relacionados de una misma escena o actividad.
    - difícil: EXACTAMENTE 5 eventos cuyo orden requiera recordar la secuencia exacta.

    JSON REQUERIDO:
    {
      "type": "ordering",
      "question": string,
      "options": array de strings,
      "correct_answer": array de strings,
      "hint": string,
      "difficulty": "{dificultad}"
    }
  expected_output: >
    Un único objeto JSON válido con las claves exactas:
    type, question, options, correct_answer, hint, difficulty.
  agent: "ordering_agent"


validate_fill_in_the_blank_task:
  description: >
    Valida si el ejercicio fill_in_the_blank está totalmente basado en el texto original.

    EJERCICIO: {ejercicio}
    INFORMACIÓN ORIGINAL: {informacion_original}

    REGLAS:
    1. La pregunta, al rellenar el hueco, debe ser verdadera según la información original.
    2. "correct_answer" debe aparecer literalmente en la información original.
    3. La palabra oculta debe ser un dato con valor de memoria: nombre, lugar, objeto, cantidad, momento o detalle específico.
    4. Rechaza adjetivos, conectores, verbos genéricos y respuestas deducibles sin recordar el texto.
    5. Rechaza cualquier dato inventado, ambiguo o no verificable.

    RESPONDE SOLO:
    {
      "Analysis": "Ejercicio correcto o explicación breve del fallo",
      "status": "ok" o "error"
    }
  expected_output: >
    Un objeto JSON con Analysis y status.
  agent: "validator_agent"


validate_multiple_choice_task:
  description: >
    Valida si el ejercicio multiple_choice está totalmente basado en el texto original.

    EJERCICIO: {ejercicio}
    INFORMACIÓN ORIGINAL: {informacion_original}

    REGLAS:
    1. "correct_answer" debe ser un índice válido: 0, 1 o 2.
    2. options[correct_answer] debe ser la única opción verdadera según la información original.
    3. Las otras opciones deben ser falsas o no mencionadas.
    4. La pregunta debe tener respuesta clara, no ambigua y verificable.
    5. Rechaza preguntas sobre opiniones, causas no explícitas o datos inventados.

    RESPONDE SOLO:
    {
      "Analysis": "Ejercicio correcto o explicación breve del fallo",
      "status": "ok" o "error"
    }
  expected_output: >
    Un objeto JSON con Analysis y status.
  agent: "validator_agent"


validate_ordering_task:
  description: >
    Valida si el ejercicio ordering respeta la secuencia del texto original.

    EJERCICIO: {ejercicio}
    INFORMACIÓN ORIGINAL: {informacion_original}

    REGLAS:
    1. Todos los eventos deben aparecer en la información original.
    2. "correct_answer" debe estar en el mismo orden cronológico que el texto.
    3. "options" y "correct_answer" deben contener las mismas frases exactas.
    4. Cantidad EXACTA esperada: fácil = 3, media = 4, difícil = 5. Rechaza si no coincide.
    5. Rechaza eventos inventados, vagos, decorativos o sin relación temporal clara.
    6. Rechaza opciones con frases excesivamente largas o redundantes; los eventos deben ser muy cortos y concisos.

    RESPONDE SOLO:
    {
      "Analysis": "Ejercicio correcto o explicación breve del fallo",
      "status": "ok" o "error"
    }
  expected_output: >
    Un objeto JSON con Analysis y status.
  agent: "validator_agent"



corrector_task:
  description: >
    Evalúa la respuesta de un usuario en un ejercicio de "Rellenar el hueco" (fill_in_the_blank).
    
    PALABRA CORRECTA ORIGINAL: {correct_answer}
    RESPUESTA DEL USUARIO: {user_answer}
    
    REGLAS DE CORRECCIÓN:
    1. Si coinciden exactamente o ignorando mayúsculas/minúsculas y tildes -> status: "ok"
    2. Si son sinónimos o palabras semánticamente muy cercanas dadas en el contexto -> status: "ok"
    3. Si el usuario ha cometido un ligero error tipográfico (typo, falta de ortografía menor) pero la intención y el concepto son claramente los mismos -> status: "ok"
    4. Si la palabra del usuario no tiene nada que ver, cambia radicalmente el significado o es un concepto distinto -> status: "error"
    
    RESULTADO ESPERADO (JSON valid code):
    {
      "analysis": "Breve explicación de la evaluación (ej. 'Respuesta correcta', 'Tiene un ligero typo pero es válida', o 'La palabra es incorrecta porque...').",
      "status": "ok" o "error"
    }

  expected_output: >
    Un objeto JSON con las claves 'analysis' y 'status'.
  agent: "corrector_agent"
